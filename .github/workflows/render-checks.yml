name: PHP syntax and Docker checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd, zip, intl, mbstring, xml, soap
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || { echo "Syntax error: $file"; exit 1; }
          done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          echo "All PHP files passed php -l."
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Render image
        run: docker build -t opensis-render-test .
