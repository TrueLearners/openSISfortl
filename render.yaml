services:
  - type: web
    name: opensis
    runtime: docker
    plan: free
    healthCheckPath: /healthz.php
    envVars:
      - key: APP_ENV
        value: production
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_ENDPOINT
        sync: false
